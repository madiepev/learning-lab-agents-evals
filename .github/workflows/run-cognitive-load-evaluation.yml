name: Run Cognitive Load Evaluation

on:
  workflow_dispatch:
    inputs:
      input_source:
        description: "What to evaluate"
        required: true
        type: choice
        options:
          - "smoke-test-results"
          - "introductory-units"
          - "revised-units"
          - "custom-path"
        default: "smoke-test-results"
      agent_name:
        description: "Agent name (for smoke-test-results option, e.g., learn-unit-writer)"
        required: false
        default: "learn-unit-writer"
      custom_path:
        description: "Custom file/directory path (for custom-path option)"
        required: false
        default: ""
      model_override:
        description: "Override model (leave empty to use default openai/gpt-4o)"
        required: false
        default: ""
      run_all_agents:
        description: "Evaluate ALL agent smoke test results"
        type: boolean
        default: false

jobs:
  evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Single evaluation mode ---
      - name: Evaluate single source
        if: ${{ github.event.inputs.run_all_agents != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_NAME: ${{ github.event.inputs.model_override }}
        run: |
          # Determine input file based on source type
          case "${{ github.event.inputs.input_source }}" in
            "smoke-test-results")
              INPUT_FILE="evaluation/data/instructional-design-results/smoke-test-results-${{ github.event.inputs.agent_name }}.jsonl"
              ;;
            "introductory-units")
              INPUT_FILE="introductory-units"
              ;;
            "revised-units")
              INPUT_FILE="introductory-units/revised"
              ;;
            "custom-path")
              INPUT_FILE="${{ github.event.inputs.custom_path }}"
              ;;
          esac

          echo "Evaluating: $INPUT_FILE"
          
          if [ ! -e "$INPUT_FILE" ]; then
            echo "ERROR: Input file/directory not found: $INPUT_FILE"
            exit 1
          fi

          export INPUT_FILE
          export OUTPUT_DIR="reports"
          
          python evaluation/scripts/cognitive-load-rubric.py

      # --- Batch mode: all agents ---
      - name: Evaluate all agent smoke test results
        if: ${{ github.event.inputs.run_all_agents == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_NAME: ${{ github.event.inputs.model_override }}
        run: |
          FAILED=0
          
          for RESULTS_FILE in evaluation/data/instructional-design-results/smoke-test-results-*.jsonl; do
            # Extract agent name from filename
            AGENT_NAME=$(basename "$RESULTS_FILE" .jsonl | sed 's/^smoke-test-results-//')

            echo ""
            echo "=========================================="
            echo "Evaluating: $AGENT_NAME"
            echo "=========================================="

            export INPUT_FILE="$RESULTS_FILE"
            export OUTPUT_DIR="reports"
            
            if python evaluation/scripts/cognitive-load-rubric.py; then
              echo "✓ $AGENT_NAME completed successfully"
            else
              echo "✗ $AGENT_NAME failed"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=========================================="
          echo "Summary"
          echo "=========================================="
          
          if [ $FAILED -eq 0 ]; then
            echo "All evaluations completed successfully!"
          else
            echo "$FAILED evaluation(s) failed"
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-load-reports
          path: reports/rubric-evaluation-*.md
          retention-days: 90

      - name: Commit reports (optional)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add reports/rubric-evaluation-*.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add cognitive load evaluation reports [skip ci]"
            git push
          fi
