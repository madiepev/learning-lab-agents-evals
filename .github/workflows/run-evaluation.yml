name: Run Evaluation

on:
  workflow_dispatch:
    inputs:
      agent_file:
        description: "Agent to evaluate. Ignored when run_all is true."
        required: false
        type: choice
        default: "agents/learn-unit-writer.agent.md"
        options:
          - "agents/drift-detector.agent.md"
          - "agents/freshness-report.agent.md"
          - "agents/learn-content-planner.agent.md"
          - "agents/learn-module-writer.agent.md"
          - "agents/learn-unit-writer.agent.md"
          - "agents/light-unit-writer.agent.md"
          - "agents/skilling-session-pptx.agent.md"
      test_file:
        description: "Path to test JSONL"
        required: false
        default: "evaluation/data/technical-accuracy-tests/smoke-test.jsonl"
      run_all:
        description: "Evaluate ALL agents in agents/ folder"
        type: boolean
        default: false
      run_foundry:
        description: "Upload results to Microsoft Foundry for cloud evaluation"
        type: boolean
        default: false
      run_similarity:
        description: "Run similarity scoring (cosine, token F1, BERTScore) on results. Adds several minutes and downloads ~1.4 GB of model weights."
        type: boolean
        default: false
      model_override:
        description: "Override model (leave empty to use default openai/gpt-4.1)"
        required: false
        default: ""

jobs:
  evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache HuggingFace models
        if: ${{ github.event.inputs.run_similarity == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bertscore-roberta-large-minilm-v1

      # --- Single agent mode ---
      - name: Generate responses (single agent)
        if: ${{ github.event.inputs.run_all != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_OVERRIDE: ${{ github.event.inputs.model_override }}
          TEST_FILE: ${{ github.event.inputs.test_file }}
          AGENT_FILE: ${{ github.event.inputs.agent_file }}
        run: |
          AGENT_NAME=$(basename "$AGENT_FILE" .agent.md)
          export RESULTS_FILE="evaluation/data/technical-accuracy-results/smoke-test-results-${AGENT_NAME}.jsonl"
          python evaluation/scripts/run_eval_agentic.py
          echo "RESULTS_FILE=${RESULTS_FILE}" >> "$GITHUB_ENV"

      - name: Score responses (single agent)
        if: ${{ github.event.inputs.run_all != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS_FILE: ${{ env.RESULTS_FILE }}
        run: python evaluation/scripts/compare.py

      - name: Score similarity (single agent)
        if: ${{ github.event.inputs.run_all != 'true' && github.event.inputs.run_similarity == 'true' }}
        env:
          RESULTS_FILE: ${{ env.RESULTS_FILE }}
        run: python evaluation/scripts/compare_similarity.py "$RESULTS_FILE"

      # --- Batch mode: all agents ---
      - name: Evaluate all agents
        if: ${{ github.event.inputs.run_all == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_OVERRIDE: ${{ github.event.inputs.model_override }}
          TEST_FILE: ${{ github.event.inputs.test_file }}
          RUN_SIMILARITY: ${{ github.event.inputs.run_similarity }}
        run: |
          FAILED=0
          for AGENT_FILE in agents/*.agent.md; do
            AGENT_NAME=$(basename "$AGENT_FILE" .agent.md)

            # Skip the evaluation runner itself
            if [ "$AGENT_NAME" = "evaluation-runner" ]; then
              echo "Skipping evaluation-runner"
              continue
            fi

            echo ""
            echo "=========================================="
            echo "Evaluating: $AGENT_NAME"
            echo "=========================================="

            export AGENT_FILE
            export RESULTS_FILE="evaluation/data/technical-accuracy-results/smoke-test-results-${AGENT_NAME}.jsonl"

            python evaluation/scripts/run_eval_agentic.py
            python evaluation/scripts/compare.py || FAILED=1

            if [ "$RUN_SIMILARITY" = "true" ]; then
              python evaluation/scripts/compare_similarity.py "$RESULTS_FILE" || true
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::One or more agents failed the evaluation threshold."
          fi

      # --- Commit results ---
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluation/data/technical-accuracy-results/ reports/
          git diff --cached --quiet || git commit -m "chore: add evaluation results [skip ci]"
          git pull --rebase
          git push

      # --- Optional: Foundry cloud evaluation ---
      - name: Azure Login
        if: ${{ github.event.inputs.run_foundry == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Foundry cloud evaluation
        if: ${{ github.event.inputs.run_foundry == 'true' }}
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'gpt-4.1' }}
        run: python evaluation/scripts/evaluate_agent.py
